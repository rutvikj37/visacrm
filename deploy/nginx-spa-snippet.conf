# shared by the three frontends (installed as /etc/nginx/snippets/visacrm-spa.conf)
index index.html;

# hashed build files never change - cache for a year
location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# the app shell must always be fresh so new deploys show up immediately
location = /index.html {
    add_header Cache-Control "no-cache";
}

# client-side routes (/crm/leads, /fees, ...) all load index.html
location / {
    try_files $uri $uri/ /index.html;
}

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
