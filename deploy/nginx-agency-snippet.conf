# Agency panel at /agency/ (installed as /etc/nginx/snippets/visacrm-agency.conf).
# Included in every agency's site (rutvik.techxsolutions.io/agency/, next to the student portal at /)
# and in crm.techxsolutions.io. The panel is built with Vite base "/agency/"; install-auto-https.sh links
# /var/www/visacrm-agency/agency -> abroly_visa_platform_agent/dist.

location = /agency { return 301 /agency/; }

# hashed build files never change - cache for a year
location ^~ /agency/assets/ {
    root /var/www/visacrm-agency;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# panel routes (/agency/crm/leads, ...) load the panel's index.html; never cached so deploys show up at once
location ^~ /agency/ {
    root /var/www/visacrm-agency;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /agency/index.html;
}
