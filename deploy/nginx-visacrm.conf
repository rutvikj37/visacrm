# TechX CRM - Nginx sites (installed by deploy/setup-server.sh, HTTPS added by certbot)
#   api.techxsolutions.io      -> API on 127.0.0.1:4001
#   admin / crm / student      -> built frontends (static files, single-page apps)

server {
    listen 80;
    server_name api.techxsolutions.io;
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name admin.techxsolutions.io;
    root /opt/visacrm/abroly_visa_platform_admin/dist;
    include /etc/nginx/snippets/visacrm-spa.conf;
}

server {
    listen 80;
    server_name crm.techxsolutions.io;
    root /opt/visacrm/abroly_visa_platform_agent/dist;
    include /etc/nginx/snippets/visacrm-spa.conf;
}

server {
    listen 80;
    # Shared student SPA + per-agency portals: agency.techxsolutions.io (branding from get_agency)
    server_name student.techxsolutions.io *.techxsolutions.io;
    root /opt/visacrm/abroly_visa_platform_student/dist;
    include /etc/nginx/snippets/visacrm-spa.conf;
}
