# TechX CRM - Nginx sites. Installed by deploy/install-auto-https.sh (do not edit on the server; edit here).
# Two products, each with its own API and database:
#   Visa CRM:   api.techxsolutions.io -> 127.0.0.1:4001; crm (shared agency panel), student
#   Travel CRM: travel-api.techxsolutions.io -> 127.0.0.1:4002; travel (shared agency panel + client portal)
#   admin.techxsolutions.io        -> one admin panel for both (Visa / Travel switch)
#   <agency>.techxsolutions.io and agencies' own domains -> that product's portal at /, agency panel at /agency/;
#   one file per address in /etc/nginx/visacrm-portals/, written by deploy/auto-certs.sh once it has a certificate.

# Port 80 for every host: Let's Encrypt checks (shared webroot), everything else goes to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS for an address that has no site (yet): refuse the connection instead of showing another site's
# certificate. A new agency address gets its own certificate within seconds (deploy/auto-certs.sh).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.techxsolutions.io;
    ssl_certificate /etc/letsencrypt/live/api.techxsolutions.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.techxsolutions.io/privkey.pem;
    include /etc/nginx/snippets/visacrm-ssl.conf;
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.techxsolutions.io;
    ssl_certificate /etc/letsencrypt/live/admin.techxsolutions.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.techxsolutions.io/privkey.pem;
    include /etc/nginx/snippets/visacrm-ssl.conf;
    root /opt/visacrm/abroly_visa_platform_admin/dist;
    include /etc/nginx/snippets/visacrm-spa.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crm.techxsolutions.io;
    ssl_certificate /etc/letsencrypt/live/crm.techxsolutions.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.techxsolutions.io/privkey.pem;
    include /etc/nginx/snippets/visacrm-ssl.conf;
    # shared agency panel (agencies without their own address): crm.techxsolutions.io/agency/
    include /etc/nginx/snippets/visacrm-agency.conf;
    # old links (crm.techxsolutions.io/crm/leads, ...) -> same page under /agency
    location / { return 301 /agency$request_uri; }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# student.techxsolutions.io: the platform's own student site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name student.techxsolutions.io;
    ssl_certificate /etc/letsencrypt/live/student.techxsolutions.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/student.techxsolutions.io/privkey.pem;
    include /etc/nginx/snippets/visacrm-ssl.conf;
    root /opt/visacrm/abroly_visa_platform_student/dist;
    include /etc/nginx/snippets/visacrm-spa.conf;
}

# Travel CRM API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name travel-api.techxsolutions.io;
    ssl_certificate /etc/letsencrypt/live/travel-api.techxsolutions.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/travel-api.techxsolutions.io/privkey.pem;
    include /etc/nginx/snippets/visacrm-ssl.conf;
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}

# travel.techxsolutions.io: Travel CRM shared agency panel at /agency/ and the platform's client portal at /
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name travel.techxsolutions.io;
    ssl_certificate /etc/letsencrypt/live/travel.techxsolutions.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/travel.techxsolutions.io/privkey.pem;
    include /etc/nginx/snippets/visacrm-ssl.conf;
    include /etc/nginx/snippets/travelcrm-agency.conf;
    root /opt/visacrm/travel_crm_portal/dist;
    include /etc/nginx/snippets/visacrm-spa.conf;
}

# agency portals (generated)
include /etc/nginx/visacrm-portals/*.conf;
