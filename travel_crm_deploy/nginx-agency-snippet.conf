# Travel CRM agency panel at /agency/ (installed as /etc/nginx/snippets/travelcrm-agency.conf).
# Included in every agency's site (<travel agency address>/agency/, next to the client portal at /)
# and in travel.techxsolutions.io. The panel is built with Vite base "/agency/"; install-auto-https.sh links
# /var/www/travelcrm-agency/agency -> travel_crm_agent/dist.

location = /agency { return 301 /agency/; }

# hashed build files never change - cache for a year
location ^~ /agency/assets/ {
    root /var/www/travelcrm-agency;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# panel routes (/agency/crm/leads, ...) load the panel's index.html; never cached so deploys show up at once
location ^~ /agency/ {
    root /var/www/travelcrm-agency;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /agency/index.html;
}
