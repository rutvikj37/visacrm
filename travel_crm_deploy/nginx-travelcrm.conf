# Travel CRM - Nginx sites. Installed as /etc/nginx/sites-available/travelcrm.conf by deploy/install-auto-https.sh
# (do not edit on the server; edit here).
#   travel-api.techxsolutions.io -> API on 127.0.0.1:4002
#   travel.techxsolutions.io     -> client portal at /, shared agency panel at /agency/
#   Travel CRM agency addresses  -> one file each in /etc/nginx/travelcrm-portals/, written by deploy/auto-certs.sh
# The port 80 site (Let's Encrypt + redirect to HTTPS) and the default HTTPS site come from the Visa CRM
# (/opt/visacrm/deploy/nginx-visacrm.conf); both products share this server's Nginx and the webroot /var/www/letsencrypt.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name travel-api.techxsolutions.io;
    ssl_certificate /etc/letsencrypt/live/travel-api.techxsolutions.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/travel-api.techxsolutions.io/privkey.pem;
    include /etc/nginx/snippets/travelcrm-ssl.conf;
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name travel.techxsolutions.io;
    ssl_certificate /etc/letsencrypt/live/travel.techxsolutions.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/travel.techxsolutions.io/privkey.pem;
    include /etc/nginx/snippets/travelcrm-ssl.conf;
    include /etc/nginx/snippets/travelcrm-agency.conf;
    root /opt/travelcrm/travel_crm_portal/dist;
    include /etc/nginx/snippets/travelcrm-spa.conf;
}

# Travel CRM agency portals (generated)
include /etc/nginx/travelcrm-portals/*.conf;
