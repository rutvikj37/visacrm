# Type-check and build every app on each push / pull request, so a broken
# build or a TypeScript error is caught before it is deployed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, admin, agent, student]
    defaults:
      run:
        working-directory: abroly_visa_platform_${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: abroly_visa_platform_${{ matrix.app }}/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build
