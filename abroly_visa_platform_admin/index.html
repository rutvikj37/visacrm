<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechX CRM</title>
    <style>
      /* before the app's CSS arrives: page background in light and dark, so the first frame matches the app */
      html, body { background: #ffffff; margin: 0; }
      html.dark, html.dark body { background: hsl(0 0% 3.9%); color-scheme: dark; }
    </style>
    <script>
      // light / dark mode before first paint (main.tsx repeats this; ThemeToggle keeps "theme" in sync)
      try {
        var t = localStorage.getItem("theme"), d = t === "dark";
        if (!d) { var p = localStorage.getItem("persist:root"); if (p) { var r = JSON.parse(p); d = !!(r && r.theme && JSON.parse(r.theme).darkMode); } }
        if (d) { document.documentElement.classList.add("dark"); document.documentElement.style.colorScheme = "dark"; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
